# Render Blueprint: Render -> New -> Blueprint -> pick this repo. Creates the API and a Postgres database.
# (The frontend is deployed separately on Vercel; see DEPLOY.md.)
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: portfolio-backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Asked for when the Blueprint is created (never stored in git):
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL        # your Vercel URL, e.g. https://caleb-portfolio.vercel.app
        sync: false
      - key: CORS_ORIGINS        # same Vercel URL (comma-separate more if you add a custom domain)
        sync: false
      - key: BREVO_API_KEY       # see NEWSLETTER-EMAIL-SETUP.md
        sync: false
      - key: MAIL_FROM           # e.g. Caleb <you@gmail.com> (must be a sender verified in Brevo)
        sync: false
      - key: CONTACT_INBOX       # where contact-form notifications go
        sync: false
      - key: GITHUB_TOKEN        # optional but recommended: lifts GitHub's 60 requests/hour limit
        sync: false
      - key: GITHUB_USERNAME
        value: Caleb-Oyewole

databases:
  - name: portfolio-db
    plan: free
